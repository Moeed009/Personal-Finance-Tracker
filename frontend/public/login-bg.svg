<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.55" stop-color="#312e81"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="0.6" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#base)"/>
  <ellipse cx="260" cy="180" rx="620" ry="520" fill="url(#g1)"/>
  <ellipse cx="1700" cy="260" rx="560" ry="480" fill="url(#g2)"/>
  <ellipse cx="1350" cy="1050" rx="700" ry="420" fill="url(#g3)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- bars -->
  <g fill="#ffffff" fill-opacity="0.06">
    <rect x="120" y="760" width="70" height="320" rx="10"/>
    <rect x="230" y="680" width="70" height="400" rx="10"/>
    <rect x="340" y="720" width="70" height="360" rx="10"/>
    <rect x="450" y="610" width="70" height="470" rx="10"/>
    <rect x="1400" y="640" width="70" height="440" rx="10"/>
    <rect x="1510" y="540" width="70" height="540" rx="10"/>
    <rect x="1620" y="590" width="70" height="490" rx="10"/>
    <rect x="1730" y="440" width="70" height="640" rx="10"/>
  </g>

  <!-- rising trend line -->
  <path d="M0 900 C 200 860, 300 780, 480 800 S 760 700, 940 690 S 1220 560, 1400 520 S 1700 330, 1920 260 V1080 H0 Z" fill="url(#area)"/>
  <path d="M0 900 C 200 860, 300 780, 480 800 S 760 700, 940 690 S 1220 560, 1400 520 S 1700 330, 1920 260" fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
  <g fill="#e0e7ff">
    <circle cx="480" cy="800" r="7"/>
    <circle cx="1400" cy="520" r="7"/>
  </g>
  <g fill="none" stroke="#e0e7ff" stroke-opacity="0.35" stroke-width="2">
    <circle cx="480" cy="800" r="16"/>
    <circle cx="1400" cy="520" r="16"/>
  </g>

  <!-- coins -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3">
    <circle cx="1560" cy="170" r="90"/>
    <circle cx="1560" cy="170" r="62"/>
    <circle cx="300" cy="420" r="54"/>
    <circle cx="300" cy="420" r="36"/>
  </g>
</svg>

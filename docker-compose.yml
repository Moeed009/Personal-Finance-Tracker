name: personal-finance-tracker

services:
  backend:
    build: .
    env_file: .env
    environment:
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost:8080}
    ports:
      - "127.0.0.1:8001:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
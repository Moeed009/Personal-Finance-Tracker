[project]
name = "personal-finance-tracker"
version = "0.1.0"
description = "Personal finance tracker - FastAPI backend"
readme = "README.md"
authors = [
    { name = "Abdul Moeed", email = "abdulmueed417@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "apscheduler>=3.11.3",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "pyjwt[crypto]>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.54",
    "supabase>=2.31.0",
    "uvicorn[standard]>=0.53.0",
    "apscheduler",
    "pytest"
    
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
